name: CI

on:
  push:
    branches: [main, "claude/**"]
    # docs-only pushes do not spend CI minutes (pull requests are always checked in full)
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  node:
    name: Node (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows runners (2x minutes) only on pull requests and pushes to main; Ubuntu always.
        os: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version read from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install ffmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - run: pnpm install --frozen-lockfile
      # Chrome Headless Shell for the Remotion integration test (skipped only if the host is blocked).
      - run: pnpm --filter @studio/remotion browser:ensure
        continue-on-error: false
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      # studio-mcp over stdio: initialize + tools/list (no API needed)
      - run: pnpm --filter @studio/studio-mcp smoke

  workers:
    name: Python workers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows runners (2x minutes) only on pull requests and pushes to main; Ubuntu always.
        os: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: apps/workers
    env:
      # Sprint 4 (rule 13): CI never creates the isolated tool venvs (tools/<id>/.venv) nor
      # downloads models; the `tool_venv` pytest marker tests stay skipped.
      STUDIO_TOOL_VENV_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: apps/workers/requirements-dev.txt
      # ffmpeg/ffprobe on PATH: the Sprint 2 vision tests (lavfi clips, alpha WebM, OpenCV
      # tracking) run instead of being skipped.
      - name: Install ffmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - run: ffmpeg -version | head -n 1
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      # Sprint 4: the launcher and the bridge scripts of the isolated tools (tools/*.py, run inside
      # tools/<id>/.venv) follow the same rules (FaceFusion's app/ is git-ignored: ruff skips it).
      - run: python -m ruff check --config pyproject.toml ../../tools
      - run: python -m ruff format --config pyproject.toml --check ../../tools
      - run: python -m pytest -q

  windows-smoke:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    name: Windows smoke (setup.ps1 + start.ps1)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - run: choco install ffmpeg -y --no-progress
      # -SkipWinget: Git, Node 22, Python 3.11 and ffmpeg come from the steps above (on PATH).
      - name: setup.ps1 (first run, from zero)
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/setup.ps1 -SkipWinget -SkipRvc -SkipModels -SkipBrowser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item storage\run\setup-last.json storage\run\setup-first.json
      # Incremental re-run: everything already installed must be "omitido" (nothing executed) and faster.
      - name: setup.ps1 -Update (second run, incremental)
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/setup.ps1 -Update -SkipWinget -SkipRvc -SkipModels -SkipBrowser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $first = Get-Content -Raw storage\run\setup-first.json | ConvertFrom-Json
          $second = Get-Content -Raw storage\run\setup-last.json | ConvertFrom-Json
          Write-Host ("first: {0} s, {1} executed | second: {2} s, {3} omitted, {4} executed" -f $first.seconds, $first.executed, $second.seconds, $second.omitted, $second.executed)
          $second.steps | Where-Object { $_.action -eq 'ejecutado' } | ForEach-Object { Write-Host "executed on re-run: $($_.component) - $($_.detail)" }
          if ($second.executed -ne 0) { Write-Host 'FAIL: the re-run executed steps that were already done'; exit 1 }
          if ($second.omitted -lt 5) { Write-Host 'FAIL: too few steps recognized as installed'; exit 1 }
          if ($second.seconds -ge $first.seconds) { Write-Host 'FAIL: the re-run was not faster'; exit 1 }
          # Sprint 4: the isolated tools (FaceFusion / Chatterbox) are on demand: no venv, no download.
          foreach ($run in @($first, $second)) {
            $tools = @($run.steps | Where-Object { $_.component -like 'Herramientas aisladas*' })
            if ($tools.Count -lt 1) { Write-Host 'FAIL: no "Herramientas aisladas" step'; exit 1 }
            $ran = @($tools | Where-Object { $_.state -ne 'skip' })
            if ($ran.Count -gt 0) { Write-Host "FAIL: isolated tools ran in CI: $($ran.component -join ', ')"; exit 1 }
            $py312 = @($run.steps | Where-Object { $_.component -eq 'Python 3.12 (herramientas)' })
            if ($py312.Count -ne 1 -or $py312[0].state -eq 'fail') { Write-Host 'FAIL: Python 3.12 step missing or failed'; exit 1 }
          }
          foreach ($t in @('facefusion', 'chatterbox')) {
            if (Test-Path "tools\$t\.venv") { Write-Host "FAIL: tools\$t\.venv exists after setup"; exit 1 }
          }
      - name: Start services and poll health (3 min)
        run: |
          Start-Process powershell -WindowStyle Hidden -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'scripts\windows\start.ps1', '-SingleConsole', '-NoBrowser')
          $urls = @('http://127.0.0.1:3000/', 'http://127.0.0.1:3001/api/health', 'http://127.0.0.1:8001/health')
          $ok = @{}
          $deadline = (Get-Date).AddMinutes(3)
          while ((Get-Date) -lt $deadline -and $ok.Count -lt $urls.Count) {
            foreach ($u in $urls) {
              if ($ok.ContainsKey($u)) { continue }
              try {
                $r = Invoke-WebRequest -Uri $u -UseBasicParsing -TimeoutSec 5
                if ($r.StatusCode -ge 200 -and $r.StatusCode -lt 400) { $ok[$u] = $true; Write-Host "OK $u" }
              } catch { }
            }
            Start-Sleep -Seconds 3
          }
          foreach ($u in $urls) { if (-not $ok.ContainsKey($u)) { Write-Host "FAIL $u" } }
          if ($ok.Count -lt $urls.Count) { exit 1 }
      - name: Stop services
        if: always()
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/stop.ps1
      - name: Service logs
        if: failure()
        run: Get-ChildItem storage\logs -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "== $($_.Name)"; Get-Content $_.FullName -Tail 80 }
